# Music Grabber, standalone. Phase 5 adds worked examples for sharing a folder with
# BPM Tagger and Navidrome; see README.md.
services:
  music-grabber:
    build: .
    # image: gatoserio/music-grabber:latest   # published manually, only when you decide to
    container_name: music-grabber
    restart: unless-stopped
    environment:
      MUSIC_DIR: /music                 # where grabbed files are filed
      # LIBRARY_DIR: /music             # what is scanned for tracks you already have
      DB_PATH: /data/music_grabber.db

      # Spotify: https://developer.spotify.com/dashboard (see README: Spotify setup)
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:8099/callback"
      SPOTIFY_SYNC_MINUTES: "30"
      # Playlists to watch: URLs, URIs or ids, comma-separated
      WATCH_PLAYLISTS: ""

      # Providers, tried in order. Deezer needs your own ARL (see README).
      PROVIDER_ORDER: deezer,ytdlp
      DEEZER_ARL: ""
      DEEZER_QUALITY: MP3_128
      OUTPUT_FORMAT: mp3-128            # mp3-320 | mp3-128 | flac | opus-192
      PATH_TEMPLATE: "{AlbumArtist}/{Album}/{TrackNo:02d} - {Title}.{ext}"
      AUTO_ACCEPT_THRESHOLD: "0.85"
      ASK_THRESHOLD: "0.55"
      GRAB_WORKERS: "1"
      GRAB_DRY_RUN: "false"             # true: search and score, never download

      # ntfy: leave empty to disable
      NTFY_URL: https://ntfy.sh
      NTFY_TOPIC: ""
    volumes:
      - ./data:/data
      - /path/to/your/music:/music
