name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The runtime image ships ffmpeg; install it here too so transcode paths that shell
      # out are exercised where a test needs the real binary.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: CHANGELOG documents VERSION
        run: |
          version=$(cat VERSION)
          grep -q "^## \[\?${version}\]\?" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }
