name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The runtime image ships ffmpeg; install it here too so transcode paths that shell
      # out are exercised where a test needs the real binary.
      - name: Install ffmpeg
        run: bash scripts/ci-install-ffmpeg.sh
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: CHANGELOG documents VERSION
        run: |
          version=$(cat VERSION)
          grep -q "^## \[\?${version}\]\?" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Docker image builds (not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image is otherwise only built when a release is published; build it on every change
      # so a broken Dockerfile or frontend stage shows up in the PR, not at release time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
