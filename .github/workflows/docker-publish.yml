name: Publish Docker image

# Publishes gatoserio/music-grabber to Docker Hub when a GitHub release is published (the tag
# must be v<VERSION>, e.g. v0.1.0 for VERSION 0.1.0). It never runs on a push, a plain tag, a
# schedule or a pull request. "Run workflow" (with the typed confirmation) republishes the
# version in VERSION by hand, e.g. to rebuild with a fresh yt-dlp.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
# with write access to gatoserio/music-grabber). tests/test_workflows.py guards the triggers.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to push gatoserio/music-grabber:v<VERSION> to Docker Hub'
        required: true
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: gatoserio/music-grabber

jobs:
  verify:
    name: Verify release
    if: github.event_name == 'release' || inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, VERSION and CHANGELOG agree
        id: v
        run: |
          version=$(cat VERSION)
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v${version}" ]; then
            echo "::error::release tag '${{ github.event.release.tag_name }}' does not match VERSION (v${version})"; exit 1
          fi
          grep -q "^## \[\?${version}\]\?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Tests must pass before anything is published
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check .
          pytest -q

  push:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and (stable releases only) latest. Pre-releases such as
          # 1.3.0-rc.1 get only their exact tag. A manual run publishes only the exact version.
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},value=v${{ needs.verify.outputs.version }},enable=${{ github.event_name == 'release' }}
          flavor: |
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
